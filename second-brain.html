<meta name="claude:viewport-fit-sides" content="cover">
<title>세컨드 브레인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-screen app. Top bar, left vault rail, a full-bleed star-map canvas with the Jarvis console docked at its bottom. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#0c090b; --panel:#151015; --panel2:#1c151b; --line:#2e2029; --fg:#f6ecf1; --muted:#9a8792;
  --accent:#ff4fa3; --accent-hi:#ff9ccb; --accent-dim:rgba(255,79,163,.16);
  --res:#ff8a3d; --idea:#ffd447; --work:#4fb3ff; --ok:#46d38a;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Share Tech Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:220px 1fr;position:relative}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;height:46px;padding-left:var(--gl);padding-right:var(--gr);background:var(--panel);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}.dots span{width:9px;height:9px;border-radius:50%}
.dots span:nth-child(1){background:#ff5f57}.dots span:nth-child(2){background:#febc2e}.dots span:nth-child(3){background:#28c840}
.menu{display:none;color:var(--muted)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand b{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--accent);color:#2a0414}
.tabs{display:flex;gap:2px;align-self:stretch;min-width:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--muted);border-top:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-top-color:var(--accent);background:rgba(255,255,255,.03)}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(70,211,138,.12);color:var(--ok);font-size:12px;font-weight:600;white-space:nowrap}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sync.warn{background:var(--accent-dim);color:var(--accent-hi)}

.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.side-scroll{flex:1;overflow-y:auto;padding:14px 10px 10px;padding-left:max(10px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:18px}
.cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);padding:0 8px 6px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.fold{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:7px;color:#d2c3cb;text-align:left;position:relative}
.nav button:hover,.fold:hover,.note-row:hover{background:rgba(255,255,255,.04)}
.nav button.on{background:var(--accent-dim);color:var(--fg)}
.nav button.on::before{content:"";position:absolute;left:-4px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.fold span:last-child{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.fold i{width:8px;height:8px;border-radius:50%}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px}
.tag{font-family:var(--mono);font-size:11.5px;padding:3px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:#cdbdc6}
.tag:hover{border-color:var(--accent);color:var(--accent-hi)}
.note-row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:7px;text-align:left;color:#d2c3cb}
.note-row i{width:6px;height:6px;border-radius:50%;flex:none}
.note-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-left:max(14px, env(safe-area-inset-left, 0px));border-top:1px solid var(--line);font-weight:600}
.side-foot i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-hi),var(--accent) 60%,#8a0f4a)}
.side-foot button{margin-left:auto;color:var(--muted);padding:4px}

.main{position:relative;min-width:0;min-height:0;overflow:hidden}
.view{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 50%,#2a0919 0%,#12040c 48%,#070406 85%)}
.ghead{position:absolute;inset:0 0 auto 0;padding:12px var(--gr) 26px var(--gl);background:linear-gradient(var(--bg) 35%,transparent);pointer-events:none;display:grid;gap:6px}
.crumb{color:var(--muted);font-size:12.5px}.crumb b{color:var(--fg);font-weight:600}
.ghead h1{margin:0;font-size:21px;font-weight:700;display:flex;align-items:center;gap:12px}
.pill{font-family:var(--mono);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-dim);color:var(--accent-hi);margin-left:auto;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:#d2c3cb;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:7px;height:7px;border-radius:50%}
.sample{pointer-events:auto;justify-self:start;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:3px 4px 3px 10px;background:rgba(12,10,9,.6)}
.sample button{color:var(--accent-hi);padding:2px 8px;border-radius:99px;background:var(--accent-dim)}
.gfoot{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(10px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--muted);background:rgba(12,10,9,.7);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.stat b{color:var(--fg)}
.zoom{display:flex;gap:4px;pointer-events:auto}
.zoom button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(12,10,9,.7);color:var(--muted);display:grid;place-items:center}

/* Jarvis console */
.jarvis{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom, 0px));width:min(600px,calc(100% - var(--gl) - var(--gr)));display:flex;flex-direction:column;gap:8px}
.jout{background:linear-gradient(var(--accent-hi),var(--accent-hi)) top left/18px 2px no-repeat,linear-gradient(var(--accent-hi),var(--accent-hi)) top left/2px 18px no-repeat,linear-gradient(var(--accent-hi),var(--accent-hi)) bottom right/18px 2px no-repeat,linear-gradient(var(--accent-hi),var(--accent-hi)) bottom right/2px 18px no-repeat,rgba(14,8,12,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,79,163,.35);border-radius:3px;padding:12px 14px;max-height:min(36vh,330px);overflow-y:auto;box-shadow:0 0 40px rgba(255,79,163,.12)}
.jhead{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--accent);text-shadow:0 0 10px rgba(255,79,163,.8)}
.jhead button{margin-left:auto;color:var(--muted);font-family:var(--sans);letter-spacing:0;font-size:12px;padding:2px 6px}
.jsay{margin:8px 0 2px;line-height:1.55;font-size:14.5px;min-height:1.5em}
.jsay::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
.jsay.done::after{content:""}
@keyframes blink{50%{opacity:0}}
.jres{display:grid;gap:4px;margin-top:8px}
.jres button{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;align-items:center;text-align:left;padding:8px 9px;border-radius:9px;border:1px solid transparent}
.jres button:hover{background:rgba(255,79,163,.08);border-color:rgba(255,79,163,.25)}
.jres i{width:7px;height:7px;border-radius:50%}
.jres b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.jres small{grid-column:2;color:var(--muted);font-size:12.5px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jres mark{background:none;color:var(--accent-hi);font-weight:600}
.jact{margin-top:8px;padding:6px 12px;border-radius:8px;background:var(--accent);color:#2a0414;font-weight:600}
.jbar{display:flex;align-items:center;gap:8px;background:rgba(16,12,9,.92);border:1px solid rgba(255,79,163,.55);border-radius:10px;padding:5px 6px 5px 12px;box-shadow:0 0 0 4px rgba(255,79,163,.06),0 8px 30px rgba(0,0,0,.5)}
.orb{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--accent);border-right-color:transparent;position:relative;animation:spin 3.2s linear infinite}
.orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.jbar.busy .orb{animation-duration:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
.jbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px;padding:7px 0}
.jbar input::placeholder{color:var(--muted)}
.jbtn{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.jbtn:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.jbtn.on{color:var(--accent-hi)}
.jbtn.rec{background:var(--res);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,138,61,.18)}}
.jgo{background:var(--accent);color:#2a0414}.jgo:hover{background:var(--accent-hi);color:#2a0414}
.hints{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hints button{font-size:12px;color:#cdbdc6;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(12,10,9,.7)}
.hints button:hover{border-color:var(--accent);color:var(--accent-hi)}

/* Vault list */
#v-vault{overflow-y:auto;padding:16px var(--gr) 30px var(--gl)}
.vhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.vhead h1{margin:0;font-size:21px}
.vhead input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.btn{padding:8px 14px;border-radius:9px;background:var(--accent);color:#2a0414;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--res);border:1px solid rgba(255,138,61,.4)}
.vfilter{color:var(--muted);font-size:12.5px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.vfilter button{color:var(--accent-hi)}
.vlist{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vitem{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;padding:12px 14px;background:var(--panel);text-align:left;width:100%}
.vitem:hover{background:var(--panel2)}
.vitem i{width:8px;height:8px;border-radius:50%}
.vitem b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vitem time{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.vitem small{grid-column:2/-1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--panel)}

/* Editor drawer */
.editor{position:absolute;top:46px;right:0;bottom:0;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.45)}
.ehead{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-right:var(--gr);border-bottom:1px solid var(--line);color:var(--muted);font-size:12.5px}
.ehead button{margin-left:auto;padding:6px;color:var(--muted)}
.ebody{flex:1;overflow-y:auto;padding:14px;padding-right:var(--gr);padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px}
#e-title{font-size:20px;font-weight:700;background:none;border:0;outline:0;width:100%}
.erow{display:flex;gap:8px}
.erow select,.erow input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.erow input{flex:1}
#e-body{flex:1;min-height:200px;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.65;outline:0}
#e-body:focus,.erow input:focus,.erow select:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}.hint code{font-family:var(--mono);color:var(--accent-hi)}
.elinks{display:flex;flex-wrap:wrap;gap:6px}
.efoot{display:flex;justify-content:space-between;align-items:center}

.modal{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px var(--gr) 16px var(--gl)}
.sheet{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.sheet h2{margin:0;font-size:17px}
.sheet p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}
.sheet textarea{height:130px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;font-family:var(--mono);font-size:11.5px;resize:none}
.sheet .erow{flex-wrap:wrap}
.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:70;background:var(--panel2);border:1px solid var(--accent);border-radius:99px;padding:7px 14px;font-size:13px;max-width:calc(100% - 32px)}
.scrim{display:none}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .dots{display:none}.menu{display:grid;place-items:center;padding:6px}
  .brand span{display:none}
  .tab{padding:0 9px}
  .side{position:absolute;top:46px;bottom:0;left:0;width:min(270px,82%);transform:translateX(-102%);transition:transform .22s ease}
  .app.nav-open .side{transform:none}
  .app.nav-open .scrim{display:block;position:absolute;inset:46px 0 0 0;background:rgba(0,0,0,.55);z-index:25}
  .hints{display:none}
  .jarvis{bottom:calc(50px + env(safe-area-inset-bottom, 0px))}
}
@media (pointer:coarse){.jbtn{width:44px;height:44px}.zoom button{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.orb,.jbtn.rec,.jsay::after{animation:none}.side{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="menu" id="menu" aria-label="메뉴 열기"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand"><b><svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px;stroke-width:2.4"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 11l8-4M8 13l8 4"/></svg></b><span>세컨드 브레인</span></div>
    <nav class="tabs">
      <button class="tab" data-view="vault"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h18v4H3zM5 11v9h14v-9M10 15h4"/></svg>보관함</button>
      <button class="tab on" data-view="graph"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 11l8-4M8 13l8 4"/></svg>그래프 뷰</button>
    </nav>
    <div class="sync" id="sync">저장됨</div>
  </header>

  <aside class="side" id="side">
    <div class="side-scroll">
      <div>
        <div class="cap">Vault</div>
        <div class="nav">
          <button data-view="vault"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h18v4H3zM5 11v9h14v-9M10 15h4"/></svg>보관함</button>
          <button data-view="graph" class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 11l8-4M8 13l8 4"/></svg>그래프</button>
          <button id="nav-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>검색</button>
          <button id="nav-new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5H6a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1v-6M18.5 3.5l2 2L12 14l-3 1 1-3z"/></svg>새 노트</button>
        </div>
      </div>
      <div><div class="cap">Folders</div><div class="nav" id="folders"></div></div>
      <div><div class="cap">Tags</div><div class="tags" id="tags"></div></div>
      <div><div class="cap">Notes</div><div id="recent"></div></div>
    </div>
    <div class="side-foot"><i></i>내 볼트<button id="open-settings" aria-label="백업과 설정"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <section class="view" id="v-graph">
      <canvas id="cv"></canvas>
      <div class="ghead">
        <div class="crumb">내 볼트 › <b>그래프 뷰</b></div>
        <h1>그래프 뷰 <span class="pill" id="count">노드 0</span></h1>
        <div class="legend">
          <span><i style="background:var(--res)"></i>자료</span><span><i style="background:var(--idea)"></i>아이디어</span>
          <span><i style="background:var(--work)"></i>업무 기록</span><span><i style="background:var(--accent)"></i>허브</span>
        </div>
        <div class="sample" id="sample" hidden>지금 보이는 건 예시 노트예요<button id="clear-sample">비우고 시작</button></div>
      </div>
      <div class="jarvis">
        <div class="jout" id="jout" hidden>
          <div class="jhead">J.A.R.V.I.S · 응답<button id="jclose">닫기</button></div>
          <p class="jsay" id="jsay"></p>
          <div class="jres" id="jres"></div>
        </div>
        <div class="hints" id="hints">
          <button>가격 관련 뭐 있었지?</button><button>고객 인터뷰 찾아줘</button><button>#회의</button><button>내일 견적서 보내기 메모해줘</button>
        </div>
        <form class="jbar" id="jbar">
          <span class="orb" aria-hidden="true"></span>
          <input id="jq" autocomplete="off" placeholder="자비스에게 물어보세요 · 검색, 메모, 열기" aria-label="자비스에게 물어보기">
          <button type="button" class="jbtn on" id="jvoice" aria-label="음성 답변 켜기/끄기" title="음성 답변"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/></svg></button>
          <button type="button" class="jbtn" id="jmic" aria-label="말로 물어보기" title="말로 물어보기"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
          <button class="jbtn jgo" aria-label="보내기"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
      </div>

/* ---------- Jarvis ---------- */
const STOP = new Set(['관련','관련된','찾아줘','찾아','검색해줘','검색','알려줘','보여줘','뭐였지','뭐지','뭐','어디','있어','있었지','있었나','노트','메모','내가','했던','대해','대한','대해서','좀','것','거','자비스','어떻게','왜','그때','예전에','정했지','정했는지','생각했는지']);
const tokens = q => q.toLowerCase().replace(/[?!.,~"'“”]/g, ' ').split(/\s+/).map(t => { if (t.startsWith('#')) return t; const s = t.replace(/(에서|으로|이랑|에게|한테|은|는|이|가|을|를|의|도|와|과|로|에)$/, ''); return s.length >= 2 ? s : t; }).filter(t => t && !STOP.has(t));
function search(q) {
  const tk = tokens(q); if (!tk.length) return { tk, hits:[] };
  const hits = [];
  for (const n of db.notes) { let s = 0; const title = n.title.toLowerCase(), body = n.body.toLowerCase();
    for (const t of tk) { if (t[0] === '#') { if (n.tags.some(g => g.toLowerCase() === t.slice(1))) s += 6; continue; }
      if (title.includes(t)) s += 5; if (n.tags.some(g => g.toLowerCase().includes(t))) s += 4; if (FOLD[n.folder].name.includes(t)) s += 2;
      const c = body.split(t).length - 1; if (c) s += 1 + Math.min(c, 3) * .5; }
    if (s) hits.push({ n, s }); }
  hits.sort((a, b) => b.s - a.s || b.n.updated - a.n.updated);
  return { tk, hits: hits.slice(0, 12) };
}
function snippet(n, tk) {
  const body = n.body.replace(/\[\[|\]\]/g, ''); const low = body.toLowerCase(); let i = -1;
  for (const t of tk) { i = low.indexOf(t.replace('#', '')); if (i >= 0) break; }
  const s = Math.max(0, i - 24), cut = (s ? '…' : '') + body.slice(s, s + 96) + (body.length > s + 96 ? '…' : '');
  let h = esc(cut); tk.forEach(t => { const w = esc(t.replace('#', '')); if (w) h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); });
  return h;
}
let voiceOn = true, typeT, actx;
function blip(f0, f1, d, v) { if (!voiceOn) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(f1, n + d); g.gain.setValueAtTime(v || .05, n); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(actx.destination); o.start(n); o.stop(n + d); } catch (e) {} }
function speak(text) { if (!voiceOn || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/[「」“”#]/g, ' ')); u.lang = 'ko-KR'; u.rate = 1.05; u.pitch = .9; speechSynthesis.speak(u); } catch (e) {} }
function say(text, html, action) {
  const out = $('#jout'), p = $('#jsay'); out.hidden = false; $('#hints').hidden = true; $('#jres').innerHTML = html || '';
  if (action) { const b = document.createElement('button'); b.className = 'jact'; b.textContent = action.label; b.onclick = action.run; $('#jres').append(b); }
  clearInterval(typeT); p.classList.remove('done'); p.textContent = ''; let i = 0; talking = !reduce;
  if (reduce) { p.textContent = text; p.classList.add('done'); } else typeT = setInterval(() => { p.textContent = text.slice(0, i += 2); if (i >= text.length) { clearInterval(typeT); p.classList.add('done'); talking = false; } }, 22);
  speak(text);
}
function ask(raw) {
  const q = raw.trim(); if (!q) return; show('graph'); $('#jq').value = '';
  const bar = $('#jbar'); bar.classList.add('busy'); setTimeout(() => bar.classList.remove('busy'), 900); blip(620, 1240, .14); setTimeout(() => blip(1240, 1860, .2, .03), 160);
  let m;
  if (/^(전체|리셋|초기화|전체 ?보기|처음으로)/.test(q)) { setFocus(null); $('#jout').hidden = true; fit(); say('전체 그래프로 돌아왔습니다. 노트 ' + db.notes.length + '개가 연결되어 있습니다.'); return; }
  if ((m = q.match(/^(?:새 ?노트|메모|기록)\s*[:：]?\s+(.+)/)) || (m = q.match(/^(.+?)\s*(?:라고|이라고)?\s*(?:메모해 ?줘|기록해 ?줘|적어 ?줘|저장해 ?줘|메모)$/))) {
    const text = m[1].trim(), n = newNote(text.length > 28 ? text.slice(0, 28) + '…' : text, text, 'idea');
    setTimeout(() => setFocus(new Set([n.id])), 60);
    say(`기록했습니다. 「${n.title}」을 아이디어 폴더에 넣어 두었습니다.`, '', { label:'열어서 다듬기', run:() => openNote(n.id) }); return; }
  const open = q.match(/^(.+?)\s*(?:열어 ?줘|열기|열어)$/);
  const { tk, hits } = search(open ? open[1] : q);
  if (open && hits.length) { setFocus(new Set([hits[0].n.id])); openNote(hits[0].n.id); say(`「${hits[0].n.title}」을 열었습니다.`); return; }
  if (!hits.length) { setFocus(null);
    say(db.notes.length ? `“${q}”와 맞는 기록을 찾지 못했습니다. 지금 바로 남겨 둘까요?` : '아직 저장된 노트가 없습니다. 이 내용으로 첫 노트를 만들까요?', '', { label:'이 내용으로 새 노트', run:() => openNote(newNote(q, '', 'idea').id, true) }); return; }
  const ids = new Set(hits.map(h => h.n.id)); tk.filter(t => t[0] === '#' && nodeById.has(t)).forEach(t => ids.add(t));
  const label = tk.map(t => t.replace('#', '')).join(' · ');
  const text = `“${label}” 관련 기록 ${hits.length}건을 찾았습니다. 가장 가까운 건 「${hits[0].n.title}」입니다.`;
  say(text, hits.map(h => `<button data-id="${h.n.id}"><i style="background:${FOLD[h.n.folder].color}"></i><b>${esc(h.n.title || '제목 없음')}</b><small>${snippet(h.n, tk)}</small></button>`).join(''));
  setFocus(ids);
}
$('#jbar').addEventListener('submit', e => { e.preventDefault(); ask($('#jq').value); });
$('#hints').addEventListener('click', e => { if (e.target.tagName === 'BUTTON') ask(e.target.textContent); });
$('#jclose').onclick = () => { $('#jout').hidden = true; talking = false; clearInterval(typeT); setFocus(null); fit(); try { speechSynthesis.cancel(); } catch (e) {} };
$('#jvoice').onclick = e => { voiceOn = !voiceOn; e.currentTarget.classList.toggle('on', voiceOn); if (!voiceOn) try { speechSynthesis.cancel(); } catch (x) {} toast(voiceOn ? '음성 답변을 켰습니다.' : '음성 답변을 껐습니다.'); };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
$('#jmic').onclick = () => {
  if (!SR) return toast('이 브라우저는 음성 입력을 지원하지 않습니다. 글로 입력해 주세요.');
  if (rec) { rec.stop(); return; }
  try { rec = new SR(); rec.lang = 'ko-KR'; rec.interimResults = true;
    rec.onresult = ev => { const r = ev.results[ev.results.length - 1]; $('#jq').value = r[0].transcript; if (r.isFinal) ask(r[0].transcript); };
    rec.onerror = ev => toast(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? '마이크 권한이 막혀 있습니다. 글로 입력해 주세요.' : '음성을 듣지 못했습니다. 다시 눌러 주세요.');
    rec.onend = () => { rec = null; $('#jmic').classList.remove('rec'); };
    rec.start(); $('#jmic').classList.add('rec'); } catch (e) { rec = null; toast('마이크를 쓸 수 없습니다. 글로 입력해 주세요.'); }
};
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); show('graph'); $('#jq').focus(); }
  if (e.key === 'Escape') { if (!$('#settings').hidden) $('#settings').hidden = true; else if (!$('#editor').hidden) $('#e-close').click(); else $('#jclose').click(); }
});

/* ---------- backup ---------- */
$('#open-settings').onclick = () => { $('#backup').value = JSON.stringify(db); $('#settings').hidden = false; $('#app').classList.remove('nav-open'); };
$('#b-close').onclick = () => $('#settings').hidden = true;
$('#b-copy').onclick = () => { const ta = $('#backup'); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('복사했습니다.'), () => toast('선택해 두었습니다. 직접 복사해 주세요.')); };
$('#b-load').onclick = () => { try { const d = JSON.parse($('#backup').value); if (!Array.isArray(d.notes)) throw 0;
  db = { sample:false, notes:d.notes.map(n => ({ id:n.id || uid(), folder:FOLD[n.folder] ? n.folder : 'idea', title:String(n.title || ''), tags:Array.isArray(n.tags) ? n.tags.map(String) : [], body:String(n.body || ''), updated:+n.updated || Date.now() })) };
  save(); setFocus(null); refresh(); $('#settings').hidden = true; toast('노트 ' + db.notes.length + '개를 복원했습니다.'); } catch (e) { toast('백업 형식이 맞지 않습니다. 복사한 내용을 그대로 붙여넣어 주세요.'); } };
$('#b-wipe').onclick = e => { const b = e.currentTarget; if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = '정말 전부 지울까요?'; return; }
  delete b.dataset.sure; b.textContent = '전부 비우기'; db = { notes:[], sample:false }; save(); setFocus(null); refresh(); $('#settings').hidden = true; toast('볼트를 비웠습니다.'); };

/* ---------- boot ---------- */
load(); resize(); refresh();
for (let i = 0; i < 400; i++) step();
alpha = .5; hudTop = $('.ghead').offsetHeight - 16; fit(); if (camTo) { Object.assign(cam, camTo); camTo = null; } requestAnimationFrame(draw);
})();
</script>
