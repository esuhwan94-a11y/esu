<title>자비스 시안 C</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#04070b;--glass:rgba(9,16,23,.62);--line:rgba(130,200,240,.2);--acc:#6fd3ff;--hi:#dff5ff;--fg:#eef6fa;--mut:#7c92a3;--ok:#7be0b8;--warn:#ffb454;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.deck{position:relative;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:radial-gradient(circle at 50% 44%,#0c1b28 0%,#060d15 42%,#04070b 78%)}
#cv{position:absolute;inset:0;width:100%;height:100%}
.gl{background:var(--glass);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--acc)}

.hello{position:absolute;left:28px;top:26px}
.hello .t{font-family:var(--mono);font-size:50px;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.hello .d{margin-top:8px;color:var(--mut);font-size:13.5px}
.hello .g{margin-top:16px;font-size:19px;font-weight:600}
.brief{position:absolute;left:28px;top:178px;width:250px;padding:6px 16px}
.brief div{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(130,200,240,.1);font-size:13.5px;color:var(--mut)}
.brief div:last-child{border:0}
.brief b{color:var(--fg);font-size:15px;font-weight:600}
.brief b i{font-style:normal;color:var(--warn)}

.side{position:absolute;right:28px;top:26px;width:262px;padding:16px}
.side h3{font-size:17px;font-weight:650;margin:8px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:7px 12px;border-radius:3px;border:1px solid var(--line);background:rgba(111,211,255,.07);transition:background .15s}
.chips button:hover{background:rgba(111,211,255,.28)}
.jobs{margin-top:14px;display:grid;gap:8px}
.job{display:grid;grid-template-columns:30px 1fr;gap:0 10px;align-items:center;text-align:left;padding:10px;border-radius:3px;background:rgba(0,0,0,.25);width:100%}
.job i{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px}
.job .w{border:2px solid rgba(255,196,107,.25);border-top-color:var(--warn);animation:sp 1s linear infinite}
.job .d{background:rgba(109,240,196,.14);color:var(--ok)}
.job span{font-size:13px}.job small{color:var(--mut);font-size:11px}
@keyframes sp{to{transform:rotate(360deg)}}

.legend{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(760px,calc(100% - 32px))}
.legend button{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 11px;border-radius:3px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);color:var(--mut)}
.legend button:hover{color:#fff}.legend button.on{border-color:var(--warn);color:#fff}.legend button.on i{color:var(--warn)}
.legend i{width:10px;height:2px;background:currentColor}
.legend b{color:var(--fg);font-weight:600}

.cmd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 32px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:3px;border-color:rgba(111,211,255,.5);box-shadow:0 0 30px rgba(111,211,255,.1)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15.5px;padding:8px 0}
.cmd input::placeholder{color:var(--mut)}
.cmd .mic{width:40px;height:40px;border-radius:3px;background:rgba(255,255,255,.07);display:grid;place-items:center}
.cmd .mic::before{content:"";width:10px;height:16px;border-radius:6px;background:var(--hi)}
.cmd .go{width:40px;height:40px;border-radius:3px;background:var(--acc);color:#04121a;font-weight:800}

.ans{position:absolute;left:50%;top:50%;width:min(600px,calc(100% - 32px));transform:translateX(-50%);z-index:5;padding:20px 22px 22px;background:rgba(6,12,18,.86);border-radius:4px;border:1px solid rgba(111,211,255,.4);border-top:2px solid var(--acc);box-shadow:0 30px 80px rgba(0,0,0,.7)}
.ans[hidden]{display:none}
.ans.pop{animation:pop .36s cubic-bezier(.2,.9,.25,1.05)}
@keyframes pop{from{opacity:0;transform:translate(-50%,24px) scale(.96);filter:blur(8px)}to{opacity:1;transform:translate(-50%,0) scale(1);filter:blur(0)}}
.ans .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ans .hd button{font-size:12.5px;padding:6px 14px;border-radius:3px;border:1px solid var(--line)}
.ans p{font-size:17.5px;line-height:1.6}
.rows{margin-top:14px;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:11px 14px;border-radius:3px;background:rgba(255,255,255,.05)}
.row em{font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:3px;background:rgba(255,196,107,.14);color:var(--warn);white-space:nowrap}
.row.ok em{background:rgba(109,240,196,.14);color:var(--ok)}
.note{position:absolute;left:50%;transform:translateX(-50%);top:14px;font-size:11px;color:var(--mut);white-space:nowrap}
.pill{display:none}
@media (max-width:900px){
  .brief{display:none}.legend{bottom:calc(88px + env(safe-area-inset-bottom,0px));flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:calc(100% - 32px)}.legend button{white-space:nowrap;min-height:36px}
  .hello{left:20px;top:34px}.hello .t{font-size:40px}.hello .g{font-size:16px;margin-top:10px}
  .side{display:none;top:auto;right:16px;left:16px;width:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .side.open{display:block}
  .pill{display:block;position:absolute;right:16px;top:38px;padding:9px 15px;border-radius:3px;font-size:13px;min-height:40px}
  .ans{top:46%}
}
@media (prefers-reduced-motion:reduce){.job .w,.ans.pop{animation:none}}
</style>

<div class="deck">
  <canvas id="cv"></canvas>
  <div class="note">시안 C · 숫자와 업체명은 예시입니다</div>

  <div class="hello"><div class="t" id="clk">--:--</div><div class="d" id="date"></div><div class="g" id="greet"></div></div>
  <div class="brief gl">
    <div>화성 날씨<b>맑음 <i>9°</i></b></div>
    <div>오늘 일정<b><i>3</i>건</b></div>
    <div>안 읽은 메일<b><i>5</i>통</b></div>
    <div>출고 준비<b><i>3</i>곳 남음</b></div>
  </div>

  <button class="pill gl" id="pill">뭐 알려드릴까요?</button>
  <div class="side gl" id="side">
    <span class="lab">JARVIS</span>
    <h3>뭐 알려드릴까요?</h3>
    <div class="chips"><button>오늘 브리핑</button><button>대리점 작업목록</button><button>메일 확인</button><button>오늘 날씨</button><button>이번 주 일정</button><button>타타대우 납기</button></div>
    <div class="jobs">
      <button class="job"><i class="w"></i><span>오늘 뉴스 정리해줘</span><small>작업 중 · 방금</small></button>
      <button class="job"><i class="d">✓</i><span>화성 날씨 알려줘</span><small>완료 · 3분 전</small></button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="ans" id="ans" hidden>
    <div class="hd"><span class="lab">JARVIS · 응답</span><button id="close">닫기</button></div>
    <p id="say"></p>
    <div class="rows">
      <div class="row"><span>예시상사 가 · 예시상사 나 · 예시상사 다</span><em>준비 전</em></div>
      <div class="row ok"><span>예시상사 라 · 예시상사 마</span><em>출고 대기</em></div>
    </div>
  </div>

  <form class="cmd gl" id="cmd"><input id="q" placeholder="자비스에게 물어보세요" autocomplete="off"><button type="button" class="mic" aria-label="마이크"></button><button class="go" aria-label="보내기">↑</button></form>
</div>

<script>
