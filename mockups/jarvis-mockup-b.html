<title>자비스 시안 B</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#07040c;--glass:rgba(255,255,255,.055);--line:rgba(255,160,205,.2);--acc:#ff5fae;--hi:#ffd6ea;--fg:#fbf1f6;--mut:#a98da0;--ok:#6df0c4;--warn:#ffc46b;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.deck{position:relative;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:radial-gradient(circle at 50% 44%,#3a0d2a 0%,#170618 38%,#07040c 74%)}
#cv{position:absolute;inset:0;width:100%;height:100%}
.gl{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.35)}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--acc)}

.hello{position:absolute;left:28px;top:26px}
.hello .t{font-size:54px;font-weight:200;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.hello .d{margin-top:8px;color:var(--mut);font-size:13.5px}
.hello .g{margin-top:16px;font-size:19px;font-weight:600}
.brief{position:absolute;left:28px;top:178px;width:250px;padding:6px 16px}
.brief div{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,160,205,.1);font-size:13.5px;color:var(--mut)}
.brief div:last-child{border:0}
.brief b{color:var(--fg);font-size:15px;font-weight:600}
.brief b i{font-style:normal;color:var(--acc)}

.side{position:absolute;right:28px;top:26px;width:262px;padding:16px}
.side h3{font-size:17px;font-weight:650;margin:8px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,95,174,.07);transition:background .15s}
.chips button:hover{background:rgba(255,95,174,.28)}
.jobs{margin-top:14px;display:grid;gap:8px}
.job{display:grid;grid-template-columns:30px 1fr;gap:0 10px;align-items:center;text-align:left;padding:10px;border-radius:12px;background:rgba(0,0,0,.25);width:100%}
.job i{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px}
.job .w{border:2px solid rgba(255,196,107,.25);border-top-color:var(--warn);animation:sp 1s linear infinite}
.job .d{background:rgba(109,240,196,.14);color:var(--ok)}
.job span{font-size:13px}.job small{color:var(--mut);font-size:11px}
@keyframes sp{to{transform:rotate(360deg)}}

.legend{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(760px,calc(100% - 32px))}
.legend button{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);color:var(--mut)}
.legend button:hover{color:#fff}
.legend i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor;background:currentColor}
.legend b{color:var(--fg);font-weight:600}

.cmd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 32px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:99px;border-color:rgba(255,95,174,.5);box-shadow:0 0 0 6px rgba(255,95,174,.06),0 0 40px rgba(255,95,174,.25),inset 0 1px 0 rgba(255,255,255,.1)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15.5px;padding:8px 0}
.cmd input::placeholder{color:var(--mut)}
.cmd .mic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center}
.cmd .mic::before{content:"";width:10px;height:16px;border-radius:6px;background:var(--hi)}
.cmd .go{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff8cc6,#ff3d98);color:#2a0618;font-weight:800;box-shadow:0 0 18px rgba(255,95,174,.7)}

.ans{position:absolute;left:50%;top:50%;width:min(600px,calc(100% - 32px));transform:translateX(-50%);z-index:5;padding:20px 22px 22px;background:rgba(20,8,18,.72);border-radius:22px;box-shadow:0 0 0 1px rgba(255,95,174,.25),0 0 80px rgba(255,95,174,.3),0 30px 80px rgba(0,0,0,.6)}
.ans[hidden]{display:none}
.ans.pop{animation:pop .36s cubic-bezier(.2,.9,.25,1.05)}
@keyframes pop{from{opacity:0;transform:translate(-50%,24px) scale(.96);filter:blur(8px)}to{opacity:1;transform:translate(-50%,0) scale(1);filter:blur(0)}}
.ans .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ans .hd button{font-size:12.5px;padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
.ans p{font-size:17.5px;line-height:1.6}
.rows{margin-top:14px;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.05)}
.row em{font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:99px;background:rgba(255,196,107,.14);color:var(--warn);white-space:nowrap}
.row.ok em{background:rgba(109,240,196,.14);color:var(--ok)}
.note{position:absolute;left:50%;transform:translateX(-50%);top:14px;font-size:11px;color:var(--mut);white-space:nowrap}
.pill{display:none}
@media (max-width:900px){
  .brief,.legend{display:none}
  .hello{left:20px;top:34px}.hello .t{font-size:40px}.hello .g{font-size:16px;margin-top:10px}
  .side{display:none;top:auto;right:16px;left:16px;width:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .side.open{display:block}
  .pill{display:block;position:absolute;right:16px;top:38px;padding:9px 15px;border-radius:99px;font-size:13px;min-height:40px}
  .ans{top:46%}
}
@media (prefers-reduced-motion:reduce){.job .w,.ans.pop{animation:none}}
</style>

<div class="deck">
  <canvas id="cv"></canvas>
  <div class="note">시안 B · 숫자와 업체명은 예시입니다</div>

  <div class="hello"><div class="t" id="clk">--:--</div><div class="d" id="date"></div><div class="g" id="greet"></div></div>
  <div class="brief gl">
    <div>화성 날씨<b>맑음 <i>9°</i></b></div>
    <div>오늘 일정<b><i>3</i>건</b></div>
    <div>안 읽은 메일<b><i>5</i>통</b></div>
    <div>출고 준비<b><i>3</i>곳 남음</b></div>
  </div>

  <button class="pill gl" id="pill">뭐 알려드릴까요?</button>
  <div class="side gl" id="side">
    <span class="lab">JARVIS</span>
    <h3>뭐 알려드릴까요?</h3>
    <div class="chips"><button>오늘 브리핑</button><button>대리점 작업목록</button><button>메일 확인</button><button>오늘 날씨</button><button>이번 주 일정</button><button>타타대우 납기</button></div>
    <div class="jobs">
      <button class="job"><i class="w"></i><span>오늘 뉴스 정리해줘</span><small>작업 중 · 방금</small></button>
      <button class="job"><i class="d">✓</i><span>화성 날씨 알려줘</span><small>완료 · 3분 전</small></button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="ans" id="ans" hidden>
    <div class="hd"><span class="lab">JARVIS · 응답</span><button id="close">닫기</button></div>
    <p id="say"></p>
    <div class="rows">
      <div class="row"><span>예시상사 가 · 예시상사 나 · 예시상사 다</span><em>준비 전</em></div>
      <div class="row ok"><span>예시상사 라 · 예시상사 마</span><em>출고 대기</em></div>
    </div>
  </div>

  <form class="cmd gl" id="cmd"><input id="q" placeholder="자비스에게 물어보세요" autocomplete="off"><button type="button" class="mic" aria-label="마이크"></button><button class="go" aria-label="보내기">↑</button></form>
</div>

<script>
(() => {
const $ = s => document.querySelector(s), reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const CATS = [['출하 · 대리점', '#ff9a4d', 46], ['타타대우 · 성적서', '#ffd95a', 31], ['스킬', '#ff5fae', 44], ['통합웹 · 사내망', '#62b8ff', 38], ['메일 · 슬랙 · 드라이브', '#7ef0d0', 35], ['Claude 작업 · 결정', '#c9a0ff', 41]];
$('#legend').innerHTML = CATS.map(([n, c, v]) => `<button><i style="color:${c}"></i>${n} <b>${v}</b></button>`).join('');
const tick = () => { const d = new Date(), h = d.getHours(); $('#clk').textContent = String(h).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); $('#date').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일 · 경기도 화성시`; $('#greet').textContent = h < 12 ? '좋은 아침입니다.' : h < 18 ? '좋은 오후입니다.' : '좋은 저녁입니다.'; }; tick(); setInterval(tick, 20000);

const cv = $('#cv'), ctx = cv.getContext('2d'), b1 = document.createElement('canvas'), x1 = b1.getContext('2d');
let W = 0, H = 0, dpr = 1, R = 200, solo = 0, soloTo = 0, flashT = -1e9;
function resize() { const r = cv.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; b1.width = cv.width >> 3; b1.height = cv.height >> 3; R = Math.min(W * (W < 900 ? .38 : .17), H * .25); }

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const sprites = {}; function glow(c, x, y, r, a) { let s = sprites[c]; if (!s) { s = sprites[c] = document.createElement('canvas'); s.width = s.height = 64; const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, '#fff'); gr.addColorStop(.14, c); gr.addColorStop(.4, c + '44'); gr.addColorStop(1, c + '00'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); } ctx.globalAlpha = Math.max(0, Math.min(1, a)); ctx.drawImage(s, x - r, y - r, r * 2, r * 2); }
// memory sphere: notes sit on a shell, each topic owns a wedge of longitude
const N = 235, pts = [], total = CATS.reduce((s, c) => s + c[2], 0);
for (let i = 0; i < N; i++) { const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), a = i * 2.39996, lon = ((a % 6.283) + 6.283) % 6.283; let acc = 0, c = CATS[0][1]; for (const k of CATS) { acc += k[2] / total * 6.283; if (lon <= acc) { c = k[1]; break; } } const d = .92 + rnd() * .16; pts.push({ x: Math.cos(a) * r * d, y: y * d, z: Math.sin(a) * r * d, c, s: 1.5 + rnd() * 2.2, ph: rnd() * 6.28 }); }
const links = []; pts.forEach((p, i) => { const near = pts.map((q, j) => [j, (p.x - q.x) ** 2 + (p.y - q.y) ** 2 + (p.z - q.z) ** 2]).filter(v => v[0] !== i).sort((a, b) => a[1] - b[1]).slice(0, 2); for (const [j] of near) if (j > i || !links.some(l => l[0] === j && l[1] === i)) links.push([i, j, rnd()]); });
const inner = Array.from({ length: 70 }, () => { const u = rnd() * 2 - 1, a = rnd() * 6.283, r = Math.sqrt(1 - u * u), d = .25 + rnd() * .5; return { x: Math.cos(a) * r * d, y: u * d, z: Math.sin(a) * r * d, ph: rnd() * 6.28 }; });
const ACC = '#ff5fae', HI = '#ffd6ea';
const arc = (x, y, r, a0, a1) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), a0, a1); ctx.stroke(); };
function draw(ts) { requestAnimationFrame(draw); if (!W || document.hidden) return;
  const t = reduce ? 3 : ts / 1000, boot = reduce ? 1 : Math.min(1, ts / 2000), ez = 1 - Math.pow(1 - boot, 3);
  solo += (soloTo - solo) * (reduce ? 1 : .1); const vis = 1 - solo * .8, fl = reduce ? 0 : Math.max(0, 1 - (ts - flashT) / 700);
  const cx = W / 2, cy = H * (W < 900 ? .46 : .44) - solo * H * .2, Rr = R * ez * (1 - solo * .38) * (1 + .012 * Math.sin(t * 1.6));
  const ry = t * .16, cR = Math.cos(ry), sR = Math.sin(ry), cP = Math.cos(.32), sP = Math.sin(.32);
  const P = p => { const xa = p.x * cR + p.z * sR, za = -p.x * sR + p.z * cR, y2 = p.y * cP - za * sP, z2 = p.y * sP + za * cP, s = 3.4 / (3.4 + z2); return [cx + xa * Rr * s, cy + y2 * Rr * s, s, z2]; };
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
  // halo and orbit rings
  glow(ACC, cx, cy, Rr * 2.5, .3); ctx.strokeStyle = ACC;
  for (const [k, w, sp, segs, al] of [[1.22, 1, .12, [[0, 6.283]], .14], [1.3, 2.5, .2, [[0, .9], [2.1, .9], [4.2, .9]], .55], [1.42, 1, -.1, [[0, 2.7], [3.14, 2.7]], .3]]) { ctx.lineWidth = w; ctx.globalAlpha = al * ez; for (const [s0, l] of segs) arc(cx, cy, Rr * k, s0 + t * sp, s0 + l + t * sp); }
  // topic donut
  let a0 = -1.5708 + t * .03; ctx.lineWidth = 5; for (const [, c, v] of CATS) { const len = v / total * 6.283; ctx.strokeStyle = c; ctx.globalAlpha = .75 * ez * (.35 + .65 * vis); arc(cx, cy, Rr * 1.56, a0 + .03, a0 + len - .03); a0 += len; }
  ctx.strokeStyle = HI; ctx.lineWidth = 1; for (let i = 0; i < 120; i++) { const a = i * .05236 - t * .05; ctx.globalAlpha = (i % 10 ? .14 : .5) * ez; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * Rr * 1.64, cy + Math.sin(a) * Rr * 1.64); ctx.lineTo(cx + Math.cos(a) * Rr * (i % 10 ? 1.67 : 1.71), cy + Math.sin(a) * Rr * (i % 10 ? 1.67 : 1.71)); ctx.stroke(); }
  // voice ring while answering
  if (solo > .05 && !reduce) { ctx.lineWidth = 2; for (let i = 0; i < 100; i++) { const a = i * .06283, h = (3 + 22 * Math.abs(Math.sin(i * 1.7 + t * 9) * Math.sin(i * .37 + t * 5.3))) * solo; ctx.globalAlpha = .8 * solo; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * Rr * 1.76, cy + Math.sin(a) * Rr * 1.76); ctx.lineTo(cx + Math.cos(a) * (Rr * 1.76 + h), cy + Math.sin(a) * (Rr * 1.76 + h)); ctx.stroke(); } }
  // core and inner sparks
  for (const p of inner) { const q = P(p); glow(HI, q[0], q[1], 5 * q[2], (.3 + .5 * Math.sin(t * 2 + p.ph) ** 2) * ez); }
  const pr = 1 + .08 * Math.sin(t * 2.2) + fl; glow(ACC, cx, cy, Rr * .75 * pr, .95); glow(HI, cx, cy, Rr * .3 * pr, 1);

requestAnimationFrame(draw);

function beep() { try { const A = beep.a || (beep.a = new (window.AudioContext || window.webkitAudioContext)()); [[1700, 0], [2300, .09]].forEach(([f, d]) => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.05, A.currentTime + d); g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + d + .08); o.connect(g).connect(A.destination); o.start(A.currentTime + d); o.stop(A.currentTime + d + .09); }); } catch (e) {} }
let ty; function answer() { const a = $('#ans'), txt = '대리점 출고준비 목록입니다. 준비해야 할 곳이 세 곳, 준비를 마치고 출고를 기다리는 곳이 두 곳입니다.'; $('#side').classList.remove('open'); a.hidden = false; a.classList.remove('pop'); void a.offsetWidth; a.classList.add('pop'); soloTo = 1; flashT = performance.now(); beep(); clearInterval(ty); let i = 0; $('#say').textContent = ''; ty = setInterval(() => { $('#say').textContent = txt.slice(0, ++i); if (i >= txt.length) clearInterval(ty); }, reduce ? 0 : 22); }

$('#cmd').onsubmit = e => { e.preventDefault(); answer(); $('#q').value = ''; };
document.querySelectorAll('.chips button,.job,.legend button').forEach(b => b.onclick = answer);
$('#pill').onclick = () => $('#side').classList.toggle('open');
window.__answer = answer;
})();
</script>
