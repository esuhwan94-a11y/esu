<title>자비스 새 시안</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#06030a;--panel:rgba(16,7,14,.78);--line:rgba(255,95,170,.28);--acc:#ff4fa3;--hi:#ffd0e6;--fg:#f8ecf2;--mut:#b48aa0;--ok:#5ef2c0;--warn:#ffc46b;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.deck{position:relative;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#2b0a1c 0%,#12050e 46%,#06030a 82%)}
#cv{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 52%,rgba(3,1,4,.82) 100%)}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--acc);text-transform:uppercase}

/* top strip */
.top{position:absolute;left:16px;right:16px;top:12px;display:flex;align-items:center;gap:14px;height:40px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;letter-spacing:.32em;font-size:13px;text-shadow:0 0 14px rgba(255,79,163,.9)}
.brand i{width:22px;height:22px;border-radius:50%;border:2px solid var(--acc);box-shadow:0 0 12px var(--acc),inset 0 0 8px var(--acc);position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--hi)}
.rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent 40%,transparent 60%,var(--line));position:relative}
.rule::before,.rule::after{content:"";position:absolute;top:-3px;width:26px;height:7px;border:1px solid var(--line);border-top:0}
.rule::before{left:18%}.rule::after{right:18%}
.stat{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap}
.stat b{color:var(--fg);font-weight:600}
.stat .on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:6px;vertical-align:1px}

/* clipped panels */
.pn{position:absolute;padding:1px;background:linear-gradient(160deg,rgba(255,95,170,.75),rgba(255,95,170,.12) 45%,rgba(255,95,170,.5));clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.pn>div{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);clip-path:inherit;padding:14px;height:100%}
.pn h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pn h3 em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--mut)}

.left{left:16px;top:74px;width:232px}
.cat{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:9px;padding:7px 2px;font-size:13px;width:100%;text-align:left;border-bottom:1px solid rgba(255,95,170,.09)}
.cat:last-child{border-bottom:0}
.cat i{width:8px;height:8px;transform:rotate(45deg);box-shadow:0 0 8px currentColor;background:currentColor}
.cat span{display:block}
.cat u{display:block;height:2px;margin-top:5px;background:rgba(255,255,255,.08);text-decoration:none;position:relative}
.cat u::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:currentColor;box-shadow:0 0 6px currentColor}
.cat b{font-family:var(--mono);font-size:11.5px;color:var(--mut);font-weight:500}
.cat:hover span{color:#fff}

.right{right:16px;top:74px;width:252px}
.q{font-size:17px;font-weight:650;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;padding:7px 11px;border:1px solid var(--line);background:rgba(255,79,163,.06);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);transition:background .15s,color .15s}
.chips button:hover{background:rgba(255,79,163,.24);color:#fff}
.jobs{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.job{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px;text-align:left;width:100%}
.job small{grid-column:1/-1;color:var(--mut);font-size:11px}
.job em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.job .w{color:var(--warn)}.job .d{color:var(--ok)}
.job .w::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px solid var(--warn);border-top-color:transparent;border-radius:50%;margin-right:5px;animation:sp .9s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* corner readouts */
.read{position:absolute;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--mut);letter-spacing:.08em}
.read b{color:var(--acc);font-weight:600}
.r1{left:20px;bottom:92px}.r2{right:20px;bottom:92px;text-align:right}

/* command bar */
.cmd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 32px));padding:1px;background:linear-gradient(90deg,var(--acc),rgba(255,95,170,.2) 50%,var(--acc));clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
.cmd>div{display:flex;align-items:center;gap:10px;background:rgba(12,5,10,.94);clip-path:inherit;padding:8px 26px}
.wave{display:flex;align-items:center;gap:2px;height:26px;width:44px}
.wave i{flex:1;background:var(--acc);border-radius:1px;height:20%;animation:wv 1.1s ease-in-out infinite;box-shadow:0 0 6px var(--acc)}
@keyframes wv{50%{height:95%}}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:15px;padding:8px 0}
.cmd input::placeholder{color:var(--mut)}
.cmd .go{width:38px;height:34px;background:var(--acc);color:#1a0410;font-weight:800;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cmd .mic{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--hi)}

/* answer card */
.ans{left:50%;top:45%;width:min(620px,calc(100% - 32px));transform:translateX(-50%);z-index:5;filter:drop-shadow(0 0 40px rgba(255,79,163,.35))}
.ans[hidden]{display:none}
.ans>div{padding:18px 20px 20px;background:rgba(14,5,11,.9)}
.ans.pop{animation:pop .32s cubic-bezier(.2,.9,.25,1.1)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scaleY(.2)}to{opacity:1;transform:translateX(-50%) scaleY(1)}}
.ans .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ans .hd::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ans .hd button{order:3;font-size:12.5px;padding:6px 14px;border:1px solid var(--line)}
.ans p{font-size:17px;line-height:1.6}
.ans .rows{margin-top:12px;display:grid;gap:6px}
.ans .row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 10px;background:rgba(255,79,163,.07);border-left:2px solid var(--acc)}
.ans .row em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--warn)}
.ans .row.ok{border-color:var(--ok)}.ans .row.ok em{color:var(--ok)}
.note{position:absolute;left:50%;transform:translateX(-50%);top:58px;font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.12em;white-space:nowrap}

.pill{display:none}
@media (max-width:860px){
  .left,.read,.stat .x,.rule{display:none}
  .top{justify-content:space-between}
  .right{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:16px;right:16px;width:auto;display:none}
  .right.open{display:block}
  .pill{display:flex;position:absolute;right:16px;top:62px;align-items:center;gap:6px;padding:8px 14px;font-size:13px;border:1px solid var(--line);background:var(--panel);min-height:38px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .note{top:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .ans{top:42%}
}
@media (prefers-reduced-motion:reduce){.wave i,.job .w::before,.ans.pop{animation:none}}
</style>

<div class="deck" id="deck">
  <canvas id="cv"></canvas>
  <div class="vig"></div><div class="grain"></div>

  <div class="top">
    <div class="brand"><i></i>J.A.R.V.I.S</div>
    <div class="rule"></div>
    <div class="stat"><span class="on"><b>온라인</b></span><span class="x">노트 <b>235</b></span><span class="x">화성 <b>맑음 9°</b></span><span><b id="clk">--:--</b></span></div>
  </div>
  <div class="note">시안 · 화면의 숫자와 업체명은 예시입니다</div>

  <div class="pn left"><div>
    <h3><span class="lab">Memory</span><em>주제별 기억</em></h3>
    <div id="cats"></div>
  </div></div>

  <button class="pill" id="pill">뭐 알려드릴까요?</button>
  <div class="pn right" id="right"><div>
    <h3><span class="lab">Request</span><em>요청 목록</em></h3>
    <div class="q">뭐 알려드릴까요?</div>
    <div class="chips"><button>오늘 브리핑</button><button>대리점 작업목록</button><button>메일 확인</button><button>오늘 날씨</button><button>이번 주 일정</button><button>타타대우 납기</button></div>
    <div class="jobs">
      <button class="job"><span>오늘 뉴스 정리해줘</span><em class="w">작업 중</em><small>방금 · 누르면 진행 상황을 알려드립니다</small></button>
      <button class="job"><span>화성 날씨 알려줘</span><em class="d">완료</em><small>3분 전 · 누르면 다시 읽어드립니다</small></button>
    </div>
  </div></div>

  <div class="read r1"><b>CORE</b> 안정<br>기억 연결 <b>412</b><br>오늘 쌓인 노트 <b>+6</b></div>
  <div class="read r2">GMAIL · CAL · SLACK · DRIVE<br>출하 데이터 <b>연결됨</b><br>마지막 동기화 <b>07:41</b></div>

  <div class="pn ans" id="ans" hidden><div>
    <div class="hd"><span class="lab">Jarvis · 응답</span><button id="close">닫기</button></div>
    <p id="say"></p>
    <div class="rows">
      <div class="row"><span>예시상사 가 · 예시상사 나 · 예시상사 다</span><em>준비 전</em></div>
      <div class="row ok"><span>예시상사 라 · 예시상사 마</span><em>출고 대기</em></div>
    </div>
  </div></div>

  <form class="cmd" id="cmd"><div>
    <span class="wave" aria-hidden="true"><i></i><i style="animation-delay:-.2s"></i><i style="animation-delay:-.5s"></i><i style="animation-delay:-.8s"></i><i style="animation-delay:-.35s"></i><i style="animation-delay:-.65s"></i></span>
    <input id="q" placeholder="자비스에게 물어보세요" autocomplete="off">
    <button type="button" class="mic" aria-label="마이크">●</button>
    <button class="go" aria-label="보내기">→</button>
  </div></form>
</div>

<script>
(() => {
